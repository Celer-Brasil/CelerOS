name: build

# F5 do roadmap de maturidade: CI com build das placas + testes.
# - harness JS (Node, sem hardware) e testes host C++ rodam primeiro
# - app_lint cobre tambem os apps de board (Dog Face) e o modo `check`
#   (drift codigo x docs x stubs — erros falham, avisos passam)
# - firmware compila no container oficial do ESP-IDF 6.1 (matrix de placas)
# - size_report fecha o orcamento do slot OTA (min 64 KB livres) por placa
# - binarios sobem como artifacts (flash manual/OTA de teste)
#
# Placa nova: adicione uma entrada na matrix abaixo (board/target) — o resto
# (lint de apps, size gate) e generico.
on: [push, pull_request]

jobs:
  tests:
    name: JS harness + C++ host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # o teste C++ de host inclui lgfx_miniz do submodule LovyanGFX
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS apps harness
        run: node test/js_harness/run.js
      - name: app_lint tests (linter de apps JS)
        run: node test/app_lint/run.js
      - name: SDK tests (scaffold/types/renderer/emu)
        run: node test/sdk/run.js
      - name: Debugger tests (protocolo dmsg + cliente contra alvo Duktape falso)
        run: node test/debug/run.js
      - name: Conformidade semver (vetor unico para celerhub.py, Loja e harness)
        run: node test/semver/run.js
      - name: Mesh E2E (apps reais em varios nos simulados da CelerNet/Celer Link)
        run: node test/meshsim/run.js
      - name: Lint dos apps do repo (data/apps + hub_apps + boards/*/data/apps)
        # glob por board: placa nova cai no lint automaticamente quando
        # commitada (caminho ausente virou aviso, nao erro)
        run: node tools/app_lint/lint.js data/apps hub_apps boards/*/data/apps
      - name: Drift check (codigo x docs x stubs do harness + types do SDK)
        run: node tools/sdk/celer.js check
      - name: C++ host tests (lógica pura de main/Utils + framer HostLink)
        run: |
          g++ -std=c++17 -Wall -Wextra -DCELER_HOST_TEST -o celeros_tests test/cpp/run_tests.cpp main/Utils/AppZip.cpp main/Utils/AppPackage.cpp main/USBHost/UsbDesc.cpp
          ./celeros_tests
      - name: celerctl tests (protocolo HostLink contra device simulado)
        run: |
          pip install pyserial
          python3 test/test_celerctl.py
      - name: celerhub tests (versao de dep, drift repo x hub, teto enxuto)
        run: python3 test/test_celerhub.py
      - name: require no Duktape real (host)
        run: python3 test/duk/run.py
      - name: matilha tests (netframe da malha + no CelerNet + bond do link)
        run: python3 test/test_matilha.py

  firmware:
    name: firmware (${{ matrix.board }})
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: smartdisplay
            target: esp32s3
          - board: cyd
            target: esp32
          - board: cyd-vspi
            target: esp32
          - board: spotpear-dog
            target: esp32s3
          - board: waveshare-watch
            target: esp32s3
          - board: devkit
            target: esp32
          - board: devkit-s3
            target: esp32s3
          - board: esp32-cam
            target: esp32
    container:
      # PINADO: a tag release-v6.1 flutua (snapshot do dia) e uma build nova
      # do IDF 6.1 removeu os dac_ll_* que o LovyanGFX 1.2.30 usa no
      # Panel_CVBS (firmware job vermelho em todas as placas desde 30/09).
      # O pin bate com o IDF local (v6.1.0). Ao trocar o IDF local, troque
      # aqui tambem — e valide o LovyanGFX antes.
      image: espressif/idf:v6.1@sha256:f81b6e077e6af93c312181cd7d4e7936cfbafc5c7f77cbacba8fdd34994f218a  # v6.1.0 GA (26/08/2026)
    env:
      # cache do component manager limpo por job: runners publicos podem ter
      # um archive envenenado (~/.cache/espressif) e o "esp_littlefs
      # corrupted" sobrevivia ate ao retry (que so limpava managed_components)
      XDG_CACHE_HOME: /tmp/gh-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-${{ matrix.board }} \
            -DSDKCONFIG=build-${{ matrix.board }}/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/${{ matrix.board }}/sdkconfig.defaults" \
            -DCELEROS_BOARD=${{ matrix.board }} set-target ${{ matrix.target }}
          # esp_littlefs "corrupted" e flake do cache do runner (nao reproduz
          # no container local com download limpo): 2a tentativa com cache zerado
          idf.py -B build-${{ matrix.board }} build ||
            (rm -rf managed_components build-${{ matrix.board }} &&
             idf.py -B build-${{ matrix.board }} \
               -DSDKCONFIG=build-${{ matrix.board }}/sdkconfig \
               -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/${{ matrix.board }}/sdkconfig.defaults" \
               -DCELEROS_BOARD=${{ matrix.board }} set-target ${{ matrix.target }} &&
             idf.py -B build-${{ matrix.board }} build)
      - name: Orcamento do slot OTA (min 64 KB por placa)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # Folga de volta ao cushion unico de 64 KB: o perfil lite da CYD
          # (audio digital/mic/fisica/web fora — Kconfig CELEROS_AUDIO,
          # CELEROS_MIC, CELEROS_JS_PHYSICS) devolveu o que o microSD
          # (f4db0da, ~45 KB) tinha comido; CYD media 90 KB livres na
          # rodada do menu de recursos. esp32-cam (108 KB) tambem passa.
          MIN=64
          python3 tools/size_report.py --board ${{ matrix.board }} --min-free-kb $MIN
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: CelerOS-${{ matrix.board }}
          path: |
            build-${{ matrix.board }}/CelerOS.bin
            build-${{ matrix.board }}/bootloader/bootloader.bin
            build-${{ matrix.board }}/partition_table/partition-table.bin
          if-no-files-found: error
